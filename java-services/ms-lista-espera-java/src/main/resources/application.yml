server:
  port: 8081

spring:
  application:
    name: ms-lista-espera-java

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lista_espera_db}
    username: ${DB_USER:rednorte}
    password: ${DB_PASS:rednorte123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway maneja el esquema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.rednorte: DEBUG
    org.springframework.web: INFO
