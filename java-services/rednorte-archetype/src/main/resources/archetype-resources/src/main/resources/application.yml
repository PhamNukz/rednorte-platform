server:
  port: ${servicePort}

spring:
  application:
    name: ${artifactId}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${artifactId}_db}
    username: ${DB_USER:rednorte}
    password: ${DB_PASS:rednorte123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    ${package}: DEBUG
