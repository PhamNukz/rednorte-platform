worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── Rate limiting ─────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  # ── Upstreams (load balancing por servicio) ───────────────────────────────
  upstream lista_espera   { server ms-lista-espera:3001; }
  upstream reasignacion   { server ms-reasignacion:3002; }
  upstream pacientes      { server ms-pacientes:3003; }
  upstream agenda_medica  { server ms-agenda-medica:3004; }
  upstream notificaciones { server ms-notificaciones:3005; }
  upstream reportes       { server ms-reportes:3006; }
  upstream frontend_app   { server frontend:3000; }

  server {
    listen 80;
    server_name localhost;

    limit_req zone=api_limit burst=50 nodelay;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: Lista de Espera ──────────────────────────────────────────────────
    location /api/lista-espera/ {
      proxy_pass http://lista_espera/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Reasignación ─────────────────────────────────────────────────────
    location /api/reasignacion/ {
      proxy_pass http://reasignacion/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Pacientes ────────────────────────────────────────────────────────
    location /api/pacientes/ {
      proxy_pass http://pacientes/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Agenda Médica ────────────────────────────────────────────────────
    location /api/agenda/ {
      proxy_pass http://agenda_medica/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Notificaciones ───────────────────────────────────────────────────
    location /api/notificaciones/ {
      proxy_pass http://notificaciones/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API: Reportes ─────────────────────────────────────────────────────────
    location /api/reportes/ {
      proxy_pass http://reportes/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Health check global ───────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok","gateway":"rednorte"}';
      add_header Content-Type application/json;
    }
  }
}
