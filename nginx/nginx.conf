worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── Rate limiting ─────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  # ── Upstreams (load balancing por servicio) ───────────────────────────────
  upstream lista_espera   { server ms-lista-espera:3001; }
  upstream reasignacion   { server ms-reasignacion:3002; }
  upstream pacientes      { server ms-pacientes:3003; }
  upstream agenda_medica  { server ms-agenda-medica:3004; }
  upstream notificaciones { server ms-notificaciones:3005; }
  upstream reportes       { server ms-reportes:3006; }
  upstream frontend_app   { server frontend:3000; }

  # ── Origen CORS dinámico: acepta cualquier localhost:puerto ───────────────
  map $http_origin $cors_origin {
    default                              "";
    "~^http://localhost(:[0-9]+)?$"      $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$"  $http_origin;
  }

  server {
    listen 80;
    server_name localhost;

    limit_req zone=api_limit burst=50 nodelay;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Macro CORS: ocultar headers del upstream y agregar los propios ────────
    # Se usa en cada location de API via include-inline (duplicado para claridad)

    # ── API: Lista de Espera ──────────────────────────────────────────────────
    location /api/lista-espera/ {
      # Preflight
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        return 204;
      }
      # Ocultar CORS del upstream (Node.js ya tiene cors() que devuelve '*')
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      # Agregar CORS correcto
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://lista_espera/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Reasignación ─────────────────────────────────────────────────────
    location /api/reasignacion/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        return 204;
      }
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://reasignacion/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Pacientes ────────────────────────────────────────────────────────
    location /api/pacientes/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        return 204;
      }
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://pacientes/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Agenda Médica ────────────────────────────────────────────────────
    location /api/agenda/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        return 204;
      }
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://agenda_medica/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ── API: Notificaciones ───────────────────────────────────────────────────
    location /api/notificaciones/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        return 204;
      }
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://notificaciones/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API: Reportes ─────────────────────────────────────────────────────────
    location /api/reportes/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        return 204;
      }
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://reportes/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Health check global ───────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok","gateway":"rednorte"}';
      add_header Content-Type application/json;
    }
  }
}
